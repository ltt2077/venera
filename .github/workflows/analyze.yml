name: "analyze"
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: '3.41.4'
          architecture: x64
      - run: flutter pub get
      - uses: invertase/github-action-dart-analyzer@v1
