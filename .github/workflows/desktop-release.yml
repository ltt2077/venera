name: Build and release Venera Glass on four platforms
on:
  workflow_dispatch:
  push:
    branches: [glass-cloud, codex/v1.7.10-maintenance]
    paths:
      - tool/desktop_release.json
      - lib/**
      - assets/translation.json
      - test/**
      - pubspec.yaml
      - tool/package_ios_native.py
      - tool/verify_android_release.py
      - tool/publish_platform_release.py
      - .github/workflows/desktop-release.yml

permissions:
  contents: read

concurrency:
  group: glass-platform-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.4'

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify version across the app and all packages
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          spec = json.loads(Path('tool/desktop_release.json').read_text())
          version = re.search(r'^version:\s*(\S+)', Path('pubspec.yaml').read_text(), re.M)[1]
          about = re.search(r'final version = "([^"]+)"', Path('lib/foundation/app.dart').read_text())[1]
          assert version == f"{spec['version']}+{spec['build']}"
          assert about == spec['version']
          assert spec['release'] == f"v{about}-glass"
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sudo apt-get update
      - run: sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: dart run tool/check_backup_core.dart
      - run: flutter test
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: arm64
          cache: true
      - run: xcodebuild -version
      - run: rustup show
      - run: flutter pub get
      - name: Build iOS with native UIKit glass
        run: flutter build ios --release --no-codesign
      - name: Verify and package IPA for user signing
        run: python3 tool/package_ios_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: venera-platform-ios
          path: dist/
          if-no-files-found: error

  macos:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
      FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: arm64
          cache: true
      - run: xcodebuild -version
      - run: rustup show
      - run: flutter pub get
      - name: Build universal macOS app with native AppKit glass
        run: flutter build macos --release
      - name: Verify and package macOS app
        run: |
          python3 - <<'PY'
          import json, os, plistlib, shutil, subprocess
          from pathlib import Path
          spec = json.loads(Path('tool/desktop_release.json').read_text())
          app = Path('build/macos/Build/Products/Release/venera.app')
          info = plistlib.loads((app/'Contents/Info.plist').read_bytes())
          assert info['CFBundleShortVersionString'] == spec['version']
          assert str(info['CFBundleVersion']) == str(spec['build'])
          assert int(info['DTSDKName'].replace('macosx', '').split('.')[0]) >= 26
          binary = app / 'Contents/MacOS' / info['CFBundleExecutable']
          arches = subprocess.check_output(['lipo','-archs',str(binary)], text=True).split()
          assert 'arm64' in arches and 'x86_64' in arches, f'Expected universal app, got {arches}'
          subprocess.run(['codesign','--force','--deep','--sign','-','--timestamp=none','--entitlements','macos/Runner/Release.entitlements',str(app)], check=True)
          subprocess.run(['codesign','--verify','--deep','--strict',str(app)], check=True)
          stage = Path('package-macos')
          stage.mkdir()
          shutil.copytree(app, stage/'Venera.app', symlinks=True)
          (stage/'Applications').symlink_to('/Applications')
          Path('dist').mkdir()
          subprocess.run(['hdiutil','create','-volname','Venera Glass','-srcfolder',str(stage),'-ov','-format','UDZO',f"dist/venera-{spec['version']}-macos-universal.dmg"], check=True)
          subprocess.run(['ditto','-c','-k','--sequesterRsrc','--keepParent',str(app),f"dist/venera-{spec['version']}-macos-universal.zip"], check=True)
          Path('dist/BUILD-INFO-macos.txt').write_text(f"Source commit: {os.environ['GITHUB_SHA']}\nVersion: {spec['version']}+{spec['build']}\nArchitectures: {', '.join(arches)}\nAd-hoc signed; not Apple Developer ID signed or notarized.\nNative glass: macOS 26+, shader fallback on older systems.\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: venera-platform-macos
          path: dist/
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: rustup show
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Install packaging tool
        run: choco install innosetup --no-progress -y
      - name: Package portable app and installer
        shell: pwsh
        run: |
          $spec = Get-Content tool/desktop_release.json | ConvertFrom-Json
          $releaseDir = (Resolve-Path build/windows/x64/runner/Release).Path
          if (!(Test-Path "$releaseDir/venera.exe") -or !(Test-Path "$releaseDir/flutter_windows.dll")) { throw 'Incomplete Windows bundle' }
          $exeVersion = (Get-Item "$releaseDir/venera.exe").VersionInfo
          $fileVersion = "$($exeVersion.FileMajorPart).$($exeVersion.FileMinorPart).$($exeVersion.FileBuildPart).$($exeVersion.FilePrivatePart)"
          if ($fileVersion -ne "$($spec.version).$($spec.build)") { throw "Unexpected Windows version $fileVersion" }
          New-Item dist -ItemType Directory -Force | Out-Null
          $distDir = (Resolve-Path dist).Path
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "$distDir/venera-$($spec.version)-windows-x64.zip"
          $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}/Inno Setup*/ISCC.exe" | Select-Object -First 1).FullName
          & $iscc "/DAppVersion=$($spec.version)" "/DSourceDir=$releaseDir" "/DDistDir=$distDir" windows/glass-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          "Source commit: $env:GITHUB_SHA`nVersion: $($spec.version)+$($spec.build)`nArchitecture: x64`nNot Authenticode signed." | Set-Content dist/BUILD-INFO-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: venera-platform-windows
          path: dist/
          if-no-files-found: error

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Configure the existing Android signing identity
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: python3 tool/prepare_android_signing.py
      - run: rustup show
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Verify APK identity, certificate and version
        run: python3 tool/verify_android_release.py tool/desktop_release.json
      - uses: actions/upload-artifact@v4
        with:
          name: venera-platform-android
          path: dist/
          if-no-files-found: error
      - name: Remove temporary signing credentials
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/venera-release.jks"

  bundle:
    needs: [test, android, ios, macos, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: venera-platform-*
          merge-multiple: true
          path: dist/
      - name: Verify four-platform delivery
        run: python3 tool/publish_platform_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: venera-glass-four-platforms
          path: dist/
          if-no-files-found: error

  publish:
    needs: bundle
    if: github.repository == 'ltt2077/venera' && (github.ref == 'refs/heads/glass-cloud' || github.ref == 'refs/heads/codex/v1.7.10-maintenance')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: venera-glass-four-platforms
          path: dist/
      - name: Publish one release with all verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/publish_platform_release.py --publish
