name: Update comic source catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: comic-source-catalog
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: glass-cloud
      - name: Check catalog tools are installed
        id: ready
        run: |
          if test -f tool/sync_comic_sources.py; then
            echo 'installed=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.installed == 'true'
        run: python3 tool/sync_comic_sources.py
      - name: Save changed metadata
        if: steps.ready.outputs.installed == 'true'
        run: |
          if ! git diff --quiet -- comic_sources/index.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add comic_sources/index.json
            git commit -m "Update comic source catalog metadata"
            git push origin HEAD:glass-cloud
          fi
